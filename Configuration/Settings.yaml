      'copyright':
        type: string
        globalScope: true
        ui:
          label: i18n
          inspector:
            editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
            editorOptions:
              rows: 7
              required: true
      'altText':
        type: string
        ui:
          label: i18n
          inspector:
            editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
      'caption':
        type: string
        ui:
          label: i18n
          inspector:
            editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
            editorOptions:
              rows: 7
  Neos:
    userInterface:
      translation:
        autoInclude:
          Neos.MetaData:
            - 'Main'
  Fusion:
    defaultContext:
      AssetMetaData: 'Neos\MetaData\Helper\AssetMetaDataHelper'
