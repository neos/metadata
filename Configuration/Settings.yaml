Neos:
  MetaData:
    defaultDimensionSpacePoint:
      language: en
    dimensions:
      'language':
        values:
          'en':
            label: English
          'de':
            label: Deutsch

    metaDataProperties:
      'copyright':
        type: string
        globalScope: true
        ui:
          label: i18n
          inspector:
            editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
            editorOptions:
              rows: 7
              required: true
      'altText':
        type: string
      'caption':
        type: string
        ui:
          label: i18n
          inspector:
            editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
            editorOptions:
              rows: 7
